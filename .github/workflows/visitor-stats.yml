name: Sync visitor statistics
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: visitor-statistics
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/checkout@v4
        with:
          ref: visitor-stats
          path: statistics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4==4.13.4
      - name: Read public aggregate history
        run: |
          cp statistics/visitor-stats.json source/assets/visitor-stats.json
          python source/scripts/sync_visitor_stats.py
          cp source/assets/visitor-stats.json statistics/visitor-stats.json
      - name: Publish statistics only
        working-directory: statistics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add visitor-stats.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public visitor statistics'
            git push origin HEAD:visitor-stats
          fi
